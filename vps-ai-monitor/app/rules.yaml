allowed_services:
  - nginx
  - docker
  - mysql

allowed_cache:
  nginx:
    - /var/cache/nginx

actions:
  on_crit:
    mem:
      - clear_cache:
          container: nginx
          path: /var/cache/nginx
      - restart_container: nginx
      - notify: "Mémoire critique: purge cache nginx puis redémarrage"

policies:
  - name: high_cpu_nginx
    when:
      metric: cpu_usage
      over_percent: 90
      for_seconds: 300
    then:
      - action: restart_service
        args: { svc: "nginx" }
      - action: notify
        args:
          message: "CPU>90% 5min. Nginx redémarré."
