# docker-compose.yml
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports: ["9091:9090"]
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports: ["3030:3000"]
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana

  ai_agent:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: vps-ai-monitor-ai_agent
    expose:
      - "8000"
    depends_on:
      - prometheus
    environment:
      - PROM_URL=http://prometheus:9090
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - READ_JOURNAL=0
      - LOG_LEVEL=INFO
      - LOOP_INTERVAL=15
      - API_TOKEN=USER_INTERFACE
      - PORT=8000
    env_file:
      - ./app/.env
    restart: unless-stopped
    volumes:
      - ./app/rules.yaml:/workspace/app/rules.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: vps-ai-monitor-ui
    ports:
      - "8090:80"          
    depends_on:
      - ai_agent     

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    pid: host
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fuse..*|hugetlbfs|mqueue|overlay|proc|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$'
    volumes:
      - '/:/host:ro,rslave'

volumes:
  grafana-data:
